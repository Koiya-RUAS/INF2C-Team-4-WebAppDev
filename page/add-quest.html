<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest</title>
</head>
<body>
  <h1>Quest aanmaken</h1>
  <p>Hier kan je een quest aanmaken</p>
  <form>
    <label for="village-name">Dorp:</label><br>
    <input type="text" id="village-name" name="village-name"><br>

    <label for="description-quest">Beschrijving gebied:</label><br>
    <input type="text" name="description-quest" rows="10" cols="60"><br>
    <!-- hier wezen -->
     <label for="date-quest">Vertrekdatum</label><br>
    <input type="date" name="date-quest"><br>
    <label for="days-quest">Aantal dagen:</label><br>
    <input type="number" name="days-quest"><br>
    <label for="positions-quest">Aantal plekken:</label><br>
    <input type="number" name="positions-quest"><br>
  </form>

  <button>Maak quest aan</button>
</body>
</html>
